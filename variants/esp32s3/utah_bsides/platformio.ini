; Utah BSides 2025 "UTAHtastic" badge
; ESP32-S3-WROOM-1-N16R2 (16 MB flash, 2 MB PSRAM), ST7735S 160x128 TFT, LLCC68 (stock) or SX1262 (HT-RA62 mod) LoRa,
; 12-key phone keypad + 4-way joystick on a TCA9535, WS2812 button/logo/moon LEDs.
;
; Everything badge-specific lives in this folder, so merging a new Meshtastic release
; never conflicts with it. See README.md here.
[env:utah_bsides]
extends = esp32s3_base
board = esp32-s3-devkitc-1
upload_protocol = esptool
upload_speed = 921600
; changing the partition table needs a full erase and install once (see README.md)
board_upload.flash_size = 16MB
board_build.partitions = variants/esp32s3/utah_bsides/partition-table-16MB.csv

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D UTAH_BSIDES_BADGE
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/utah_bsides

; compile the .cpp files in this folder (keypad, LED scenes, badge menu), but not the
; PC-only test/preview programs in tools/
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/utah_bsides>
  -<../variants/esp32s3/utah_bsides/tools>

; turn the pictures in images/ into BadgeImagesData.h, and the maker lists in tools/data into
; generated/vendors.bin, before each build; afterwards sign the firmware for WiFi updates
extra_scripts =
  ${esp32_common.extra_scripts}
  pre:variants/esp32s3/utah_bsides/tools/make_images.py
  pre:variants/esp32s3/utah_bsides/tools/make_vendors.py
  pre:variants/esp32s3/utah_bsides/tools/make_portal.py
  pre:variants/esp32s3/utah_bsides/tools/make_chip8.py
  post:variants/esp32s3/utah_bsides/tools/sign_update.py

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21

; Scavenger-hunt beacons: one spare badge per flag, flag numbers from the table in BadgeHunt.cpp.
;   pio run -e utah_bsides_beacon0 -t upload --upload-port /dev/ttyACM0
[env:utah_bsides_beacon0]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=0
[env:utah_bsides_beacon1]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=1
[env:utah_bsides_beacon2]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=2
[env:utah_bsides_beacon3]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=3
[env:utah_bsides_beacon4]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=4
