; Utah BSides 2025 "UTAHtastic" badge
; ESP32-S3-WROOM-1, ST7735S 160x128 TFT, LLCC68 (stock) or SX1262 (HT-RA62 mod) LoRa,
; 12-key phone keypad + 4-way joystick on a TCA9535, WS2812 button/logo/moon LEDs.
;
; Everything badge-specific lives in this folder, so merging a new Meshtastic release
; never conflicts with it. See README.md here.
[env:utah_bsides]
extends = esp32s3_base
board = esp32-s3-devkitc-1
upload_protocol = esptool
upload_speed = 921600

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D UTAH_BSIDES_BADGE
  -I variants/esp32s3/utah_bsides
  ; leave out Meshtastic modules for hardware the badge doesn't have, to make room for the
  ; badge's own features (the app still shows their settings; they just do nothing):
  ; Paxcounter (counts nearby phones), ATAK (TAK map app plugin), detection sensor and
  ; remote hardware (sensors/pins), power stress (developer test), dropzone (skydiving),
  ; and power / health / air-quality telemetry (sensor chips)
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
  -D MESHTASTIC_EXCLUDE_DROPZONE=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1

; compile the .cpp files in this folder (keypad, LED scenes, badge menu), but not the
; PC-only test/preview programs in tools/
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/utah_bsides>
  -<../variants/esp32s3/utah_bsides/tools>

; turn the pictures in images/ into BadgeImagesData.h before each build
extra_scripts =
  ${esp32_common.extra_scripts}
  pre:variants/esp32s3/utah_bsides/tools/make_images.py

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21
