; Utah BSides 2025 "UTAHtastic" badge
; ESP32-S3-WROOM-1-N16R2 (16 MB flash, 2 MB PSRAM), ST7735S 160x128 TFT, LLCC68 (stock) or SX1262 (HT-RA62 mod) LoRa,
; 12-key phone keypad + 4-way joystick on a TCA9535, WS2812 button/logo/moon LEDs.
;
; Everything badge-specific lives in this folder, so merging a new Meshtastic release
; never conflicts with it. See README.md here.
[env:utah_bsides]
extends = esp32s3_base
board = esp32-s3-devkitc-1
upload_protocol = esptool
upload_speed = 921600
; changing the partition table needs a full erase and install once (see README.md)
board_upload.flash_size = 16MB
board_build.partitions = variants/esp32s3/utah_bsides/partition-table-16MB.csv
; ESP32-S3-WROOM-1-N16R2: 16 MB flash (QIO) + 2 MB quad (QSPI) PSRAM.
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi

; The badge's BLE scanner, BLE explore and tracker-beep are GATT clients, so the NimBLE host (the
; one behind the Arduino framework's BLE library the badge uses) needs the central + observer roles.
; Meshtastic's precompiled framework ships a peripheral-only host; adding these rebuilds it from
; source (HybridCompile) with the ble_gattc_*/scan symbols the badge's client and scanner need.
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_BT_NIMBLE_ROLE_CENTRAL=y
  CONFIG_BT_NIMBLE_ROLE_OBSERVER=y
  ; The BLE controller's activity table (connections + advertising + scanning). Meshtastic's base
  ; config sets it to 2 - one phone link plus its advert - which fills it, so the badge's own scan
  ; (BLE scanner, fox hunt) or client (BLE explore) got HCI 0x07 "Memory Capacity Exceeded" (rc=519).
  ; Raise it for the phone link + advert + a concurrent scan/client.
  CONFIG_BT_CTRL_BLE_MAX_ACT=6
  ; esp32-common.ini sets MAX_CONNECTIONS=1 (one phone link). The badge's BLE explore opens a client
  ; (central) while the phone stays connected, so one slot starves it. Raise it (this value overrides
  ; the inherited one). PSRAM holds the per-connection NimBLE buffers (MEM_ALLOC_MODE_EXTERNAL below),
  ; so the extra slots are cheap.
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  ; This env HybridCompiles (from-source), where pioarduino only keeps PSRAM if custom_sdkconfig
  ; literally contains both "PSRAM" and "CONFIG_SPIRAM=y" (see extra_scripts/esp32_pre.py). Without
  ; that it strips CONFIG_SPIRAM, so the N16R2's 2 MB PSRAM is dropped, everything lands in internal
  ; RAM, and the BT controller fails esp_bt_controller_init with ESP_ERR_NO_MEM. Force PSRAM on:
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_QUAD=y
  CONFIG_SPIRAM_TYPE_AUTO=y
  CONFIG_SPIRAM_SPEED_80M=y
  ; CAPS_ALLOC (not USE_MALLOC): PSRAM is available via heap_caps(MALLOC_CAP_SPIRAM) for the badge's
  ; explicit buffers and the NimBLE host, which frees internal RAM for the BT controller. Regular
  ; malloc() stays in INTERNAL RAM, so the TFT's SPI-DMA line buffer is DMA-capable - USE_MALLOC put
  ; it in PSRAM, which SPI DMA can't read, blanking the screen.
  CONFIG_SPIRAM_USE_CAPS_ALLOC=y
  ; Keep the NimBLE host in PSRAM too, leaving internal RAM for the controller's DMA memory.
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D UTAH_BSIDES_BADGE
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/utah_bsides
  ; Meshtastic's src/ has a few dual default-argument declarations (e.g. ScanI2CTwoWire) that newer
  ; GCC rejects; its CI toolchain tolerates them, so relax them to warnings here too.
  -fpermissive

; link_badge_sources.py symlinks this folder in as src/utah_bsides, so the badge compiles as part
; of src/ with no +<../...> entry (which would re-root the glob off src/ and hide src/ from the
; library dependency finder). Inherit the stock esp32 filter (+<*> relative to src/) and just drop
; the PC-only tools/ subdir. Everything stays src/-relative, so src/ and lib_deps resolve normally.
build_src_filter =
  ${esp32_common.build_src_filter}
  -<utah_bsides/tools/>

; link_badge_sources runs first (makes src/utah_bsides). Then turn the pictures in images/ into
; BadgeImagesData.h and the maker lists in tools/data into generated/vendors.bin; afterwards sign.
extra_scripts =
  ${esp32_common.extra_scripts}
  pre:variants/esp32s3/utah_bsides/tools/link_badge_sources.py
  post:variants/esp32s3/utah_bsides/tools/fix_includes.py
  pre:variants/esp32s3/utah_bsides/tools/make_images.py
  pre:variants/esp32s3/utah_bsides/tools/make_vendors.py
  pre:variants/esp32s3/utah_bsides/tools/make_portal.py
  pre:variants/esp32s3/utah_bsides/tools/make_chip8.py
  post:variants/esp32s3/utah_bsides/tools/sign_update.py

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21

; The badge's BLE (scanner, explore, tracker-beep) uses the Arduino framework's own BLE library,
; which rides on Meshtastic's IDF NimBLE host - so no extra BLE library is needed, and lib_ignore
; is inherited from esp32_common unchanged (it ignores NimBLE-Arduino, which the badge no longer uses).

; Scavenger-hunt beacons: one spare badge per flag, flag numbers from the table in BadgeHunt.cpp.
;   pio run -e utah_bsides_beacon0 -t upload --upload-port /dev/ttyACM0
[env:utah_bsides_beacon0]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=0
[env:utah_bsides_beacon1]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=1
[env:utah_bsides_beacon2]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=2
[env:utah_bsides_beacon3]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=3
[env:utah_bsides_beacon4]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_HUNT_BEACON=4

; Research build (opt-in, SELF-BUILT ONLY): adds the active WiFi/BT tools, which are compiled
; OUT of the default/shipped badge. Everything gated by BADGE_OFFENSIVE lives in AppResearch.cpp
; and the #if BADGE_OFFENSIVE blocks in BadgeMenu.cpp / variant.cpp. For authorized testing and
; networks you own only; the signed public release is always the plain utah_bsides env, so a
; distributed badge physically cannot contain these tools.
;   pio run -e utah_bsides_research -t upload --upload-port /dev/ttyACM0
[env:utah_bsides_research]
extends = env:utah_bsides
build_flags = ${env:utah_bsides.build_flags} -D BADGE_OFFENSIVE=1
